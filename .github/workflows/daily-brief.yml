name: Research daily archive

on:
  push:
    branches: [main]
  schedule:
    # UTC 00:30 = Asia/Shanghai 08:30. GitHub may delay scheduled jobs.
    - cron: '30 0 * * *'
  workflow_dispatch:
    inputs:
      generate:
        description: 'Generate today with OpenAI API (uses repository Secret)'
        type: boolean
        default: false
      revise:
        description: 'Explicitly revise today, preserving its previous version'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: research-archive-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Regression tests (no credentials)
        run: |
          python -m unittest discover -s tests -v
          node --test tests/frontend.test.mjs
      - name: Independent live generation
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.generate)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          REVISE: ${{ github.event_name == 'workflow_dispatch' && inputs.revise }}
        run: |
          args=()
          if [ "$REVISE" = "true" ]; then args+=(--revise); fi
          python scripts/generate_brief.py "${args[@]}"
      - name: Validate and build static website
        run: |
          python scripts/archive.py
          python scripts/archive.py --check
          python scripts/build_site.py
          python scripts/smoke_test.py --directory dist
      - name: Persist archive before deployment
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all archive history data
          if ! git diff --cached --quiet; then
            git commit -m 'Archive independent research brief'
            git push origin HEAD:"$DEFAULT_BRANCH"
          fi
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy in this workflow
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live entry point and index
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.request
          base = os.environ['PAGE_URL'].rstrip('/') + '/'
          for attempt in range(6):
              try:
                  with urllib.request.urlopen(base, timeout=25) as r:
                      assert '科研简报归档馆' in r.read().decode()
                  with urllib.request.urlopen(base + 'data/index.json', timeout=25) as r:
                      assert json.load(r)['schema_version'] == 1
                  print('Live Pages entry point and JSON index verified')
                  break
              except Exception:
                  if attempt == 5:
                      raise
                  time.sleep(10)
          PY
